# Project-wide Gradle settings.
#
# -Xmx4g rather than the 2g used by dsh-tabs-android: this project runs the
# Compose compiler plus KSP, and 2g is tight enough to make KSP fall over on a
# cold build with a large dependency graph.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Compose is opt-in per module so the non-UI modules do not pay for it.
android.defaults.buildfeatures.compose=false
