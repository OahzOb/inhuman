plugins {
	alias(libs.plugins.android.application)
	alias(libs.plugins.compose.compiler)
}

// Release signing is local, not checked in. The keystore and this file are in
// .gitignore; losing them means no future build can update an installed release.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
	keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
	namespace = 'com.inhuman'
	compileSdk = 37

	defaultConfig {
		applicationId = 'com.inhuman'
		// 34 rather than lower: the app's own crypto (Keystore-backed API-key
		// storage) and the file APIs it leans on are all present by then, and
		// there is no reason to carry compatibility shims for older platforms
		// in a personal project.
		minSdk = 34
		targetSdk = 36
		versionCode = 2
		versionName = '0.2.0'

		// Instrumented tests exist for questions a JVM test cannot answer --
		// today, the cost of decompressing a session log on a real device.
		testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
	}

	signingConfigs {
		if (keystorePropertiesFile.exists()) {
			release {
				storeFile rootProject.file(keystoreProperties['storeFile'])
				storePassword keystoreProperties['storePassword']
				keyAlias keystoreProperties['keyAlias']
				keyPassword keystoreProperties['keyPassword']
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled = false
			signingConfig = keystorePropertiesFile.exists() ?
				signingConfigs.release : signingConfigs.debug
		}
	}

	// `assembleRelease` otherwise resolves the lint tool from Maven even when
	// the build is offline; this environment cannot reach it. Lint is run
	// separately when the network is available.
	lint {
		checkReleaseBuilds = false
	}

	compileOptions {
		// AGP 9 changed the default source/target from 8 to 11. 17 is set
		// explicitly: it matches the JDK that runs the build, and the Compose
		// tooling expects a modern target.
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	buildFeatures {
		compose = true
	}
}

// Built-in Kotlin: compiler options live under `kotlin { compilerOptions {} }`,
// not the old `android { kotlinOptions {} }` block, which built-in Kotlin does
// not provide.
//
// The block is currently empty and that is deliberate. jvmTarget defaults to
// android.compileOptions.targetCompatibility (17 above), and no other compiler
// flag is needed: the old `-Xjvm-default=all` was carried over out of habit and
// its replacement takes a different value set than the X-prefixed form did.
kotlin {
	compilerOptions {
	}
}

dependencies {
	implementation project(':core:common')
	implementation project(':core:design')
	implementation project(':core:data')
	implementation project(':core:ai')
	implementation project(':core:files')
	implementation project(':core:engine')

	// Core modules are plain JVM now; the Android app still needs the Android
	// Main dispatcher for its ViewModels.
	implementation libs.kotlinx.coroutines.android

	// The one place the app itself makes an HTTP request that is not a DeepSeek
	// API call: a user-initiated download. The agent still has no network path.
	implementation libs.okhttp

	implementation libs.androidx.core.ktx
	implementation libs.androidx.activity.compose
	implementation libs.androidx.lifecycle.runtime.compose
	implementation libs.androidx.lifecycle.viewmodel.compose
	implementation libs.androidx.navigation.compose

	implementation platform(libs.androidx.compose.bom)
	implementation libs.androidx.compose.ui
	implementation libs.androidx.compose.ui.graphics
	implementation libs.androidx.compose.ui.tooling.preview
	implementation libs.androidx.compose.material3
	// The default icon set holds only a few dozen glyphs. Anything outside it --
	// an outlined folder, a paperclip -- needs this artifact.
	implementation libs.androidx.compose.material.icons.extended

	// Markdown. The -m3 module themes it to Material 3, and -code adds fenced
	// code blocks with syntax highlighting. The renderer's streaming state is
	// the reason it was chosen: it re-parses only the unstable tail of a
	// document, so a half-written code fence does not force the whole reply to
	// be re-parsed on every token.
	implementation libs.markdown.renderer
	implementation libs.markdown.renderer.m3
	implementation libs.markdown.renderer.code

	debugImplementation libs.androidx.compose.ui.tooling

	testImplementation libs.junit

	androidTestImplementation libs.androidx.test.junit
	androidTestImplementation libs.androidx.test.runner
	// Only for the session-log benchmark; see docs/port-assessment.md.
	// The `@aar` matters: the plain JAR's natives are desktop-only and fail at
	// runtime on device. See the note in gradle/libs.versions.toml.
	androidTestImplementation "${libs.zstd.jni.android.get()}@aar"
	// The platform JavaScript/WebAssembly sandbox, probed on device.
	androidTestImplementation libs.androidx.javascriptengine
}
