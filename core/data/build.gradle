plugins {
	alias(libs.plugins.android.library)
	alias(libs.plugins.kotlin.serialization)
}

android {
	namespace = 'com.inhuman.core.data'
	compileSdk = 37

	defaultConfig {
		minSdk = 34
		// Named rather than left to a default: AndroidJUnitRunner is what runs an
		// instrumented test, and without it the test APK installs and then dies
		// with ClassNotFoundException before a single test starts.
		testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	// `MigrationTestHelper` reads the exported schema JSONs as *assets* of the
	// test APK. The schemas now live in :core:db, where Room generates them.
	sourceSets {
		getByName('androidTest').assets.srcDir("$rootDir/core/db/schemas")
	}
}

dependencies {
	implementation project(':core:common')
	// The repository owns each conversation's workspace and its assistants, so
	// it needs the sandbox that guards the one and the provider that answers the
	// other -- creating a conversation, naming it, and listing the models it may
	// use are the same lifecycle.
	api project(':core:files')
	api project(':core:ai')
	// The database/entities/DAOs are shared with the desktop JVM module.
	api project(':core:db')

	implementation libs.androidx.room.runtime
	implementation libs.androidx.room.ktx

	// Migrations are the one thing here that can destroy a user's conversations,
	// and they are the thing least likely to be exercised by hand: reaching the
	// old schema means installing an old build. This runs them against a real
	// database on a device.
	androidTestImplementation libs.androidx.room.testing
	androidTestImplementation project(':core:documents')
	androidTestImplementation libs.androidx.test.junit
	androidTestImplementation libs.androidx.test.runner

	implementation libs.androidx.datastore.preferences
	implementation libs.kotlinx.coroutines.android
	implementation libs.kotlinx.serialization.json

	testImplementation libs.junit
}
