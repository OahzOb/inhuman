plugins {
	alias(libs.plugins.android.library)
}

android {
	namespace = 'com.inhuman.core.files'
	compileSdk = 37

	defaultConfig {
		minSdk = 34
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	// Unit tests need real files on disk (this module is about filesystem
	// semantics), so they run as JVM tests against a temp directory rather than
	// as instrumented tests against a device.
	testOptions {
		unitTests.returnDefaultValues = true
	}
}

dependencies {
	implementation project(':core:common')
	// The tools implement the Tool contract defined there. Not `api`: the
	// dependency runs one way, files -> ai, and leaking the AI module to
	// anything that depends on the sandbox would invert that.
	implementation project(':core:ai')
	implementation libs.kotlinx.coroutines.android
	implementation libs.kotlinx.serialization.json

	testImplementation libs.junit
}
