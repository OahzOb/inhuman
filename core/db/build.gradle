plugins {
	alias(libs.plugins.kotlin.jvm)
	// SnapshotStore serialises its manifests, so the compiler plugin has to be
	// here, not just the json runtime. Without it `capture` compiled and then
	// returned false at runtime: the serializer was never generated, the
	// `runCatching` swallowed the SerializationException, and every rollback
	// checkpoint silently failed.
	alias(libs.plugins.kotlin.serialization)
	alias(libs.plugins.ksp)
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
	jvmToolchain(17)
}

ksp {
	// Room writes the schema JSON here. It is committed because the migration
	// tests build the old version from it; losing it makes a missed migration
	// impossible to spot.
	arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
	// The database, entities, DAOs and the platform-free repositories are the
	// public surface of this module.
	api libs.androidx.room.runtime
	api libs.kotlinx.coroutines.core
	// `ConversationRepository.workspace` returns a `SessionWorkspace`, and the
	// policy/agent repositories expose `PolicySet`, `RemoteModel` and
	// `ChatProvider`. They are part of this module's API, not an implementation
	// detail.
	api project(':core:ai')
	api project(':core:files')
	implementation project(':core:common')
	implementation libs.kotlinx.serialization.json
	ksp libs.androidx.room.compiler

	testImplementation libs.junit
	testImplementation libs.kotlinx.coroutines.test
	testImplementation libs.kotlinx.serialization.json
	testImplementation 'androidx.sqlite:sqlite-bundled:2.5.2'
}
