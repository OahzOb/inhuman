plugins {
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.serialization)
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
	jvmToolchain(17)
}

dependencies {
	implementation project(':core:common')

	// `api` rather than `implementation` on purpose: this module's public
	// surface returns Flow<StreamChunk>, so consumers need coroutines and
	// serialization on their compile classpath regardless.
	api libs.kotlinx.coroutines.core
	api libs.kotlinx.serialization.json

	implementation libs.okhttp
	implementation libs.sshj
	implementation libs.bouncycastle.bcprov
	// Pure-Java HTML/XML parsing: readable-text extraction and the local
	// search-page parsers. No Android artifact, so the JVM tests exercise it.
	implementation libs.jsoup

	testImplementation libs.junit
	testImplementation libs.kotlinx.coroutines.test
	testImplementation libs.sshd.core
	testImplementation libs.sshd.sftp
	testRuntimeOnly libs.slf4j.simple
}
