[versions]
# Toolchain.
#
# AGP 9.4.1 / Gradle 9.8.0 / JDK 17. The JDK is the one already installed at
# C:\android-toolchain\jdk17 -- AGP 9's own compatibility table lists JDK 17 as
# both the minimum and the default, so no newer JDK is needed.
#
# AGP 9 requires Gradle >= 9.1.0 and SDK Build Tools 36.0.0, and supports up to
# API level 36.1.
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"

# AndroidX / Compose. Every Compose artifact comes from the BOM so only one
# version is ever edited.
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
datastore = "1.2.1"
documentFile = "1.1.0"

# Networking / serialization.
#
# okhttp only. There is deliberately no `okhttp-sse` and no
# `okhttp-logging`: `DeepSeekProvider` reads the event stream from the raw
# response body, and the logging interceptor would have nothing to attach to.
# Both were carried here from the first draft and neither was ever referenced.
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"

# SSH. sshj rather than JSch: JSch's EdDSA implementation cannot export an
# Ed25519 private key, and ed25519 is `ssh-keygen`'s default today. sshj brings
# BouncyCastle with it; that is the cost of accepting modern keys.
sshj = "0.41.2"
# sshj declares BouncyCastle at runtime scope; the provider class is referenced
# directly at start-up so it must be on the compile classpath too.
bouncyCastle = "1.84"
# Test-only: a real SSH server on the JVM so the client is exercised over the
# wire instead of against a hand-written fake.
minaSshd = "2.20.0"
slf4j = "2.0.17"

# Markdown. Apache-2.0, read from the published POM rather than assumed -- this
# comment used to say MIT, which was wrong.
#
# The note that used to live here said LaTeX was skipped because the only viable
# Android renderer is GPLv2. That reasoning was wrong: JLaTeXMath carries a
# linking exception permitting use from independent modules "regardless of the
# license terms of these independent modules", and this app now ships under
# Apache-2.0 anyway. LaTeX is still not rendered, but the reason is the bundled
# fonts -- some GPLv2, some OFL, some the Knuth Licence -- and the
# THIRD-PARTY-NOTICES maintenance that follows from shipping them.
markdownRenderer = "0.45.0"

# Instrumented tests. Until now this project had only JVM unit tests, which is
# the right default -- but some questions are only answerable on a device: the
# real cost of decompressing a session log on ARM64 is one, and no amount of
# desktop measurement substitutes for it.
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
zstdJni = "1.5.7-21"
javascriptEngine = "1.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }

# Compose (versions come from the BOM).
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Runs the migrations against a real database and validates the result against
# the exported schema. The tree had seven handwritten migrations and no test for
# any of them until this was added; see docs/07-gotchas.md B8.
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "minaSshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "minaSshd" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }

junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
# `androidx.test.ext:junit` does NOT bring the runner in transitively, so
# `AndroidJUnitRunner` is missing at instrumentation start-up and the process
# dies with ClassNotFoundException before a single test runs. It has to be named.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# zstd, for reading a DeepSeek Harness session log. BSD-2-Clause bindings over
# BSD-3-Clause zstd.
#
# **The `@aar` is mandatory.** The plain artifact is a JAR whose bundled natives
# are desktop-only (linux, darwin, win, aix, freebsd); resolving it into an APK
# compiles cleanly and then dies at the first call with
# `UnsatisfiedLinkError: ... cannot find /linux/x86_64/libzstd-jni-...so`.
# Nothing in the build output warns you -- the failure is at runtime, on device.
zstd-jni-android = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }

# The platform's JavaScript/WebAssembly sandbox: V8 in an isolated process,
# reached over the WebView js_sandbox AIDL service. **A measurement dependency
# today**, and the candidate for running agent-authored code if the port
# happens. See docs/port-assessment.md.
#
# Stable since 2026-09-23 (1.0.0 -> 1.1.0 -> 1.1.1), minSdk 26, and its manifest
# declares no service -- the isolated process is the platform's, not ours.
androidx-javascriptengine = { module = "androidx.javascriptengine:javascriptengine", version.ref = "javascriptEngine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# With built-in Kotlin (AGP 9's default) there is deliberately NO
# org.jetbrains.kotlin.android entry: applying it alongside AGP 9 fails with
# "Cannot add extension with name 'kotlin', as there is an extension already
# registered with that name". AGP compiles Kotlin itself.
#
# The Compose compiler plugin is still applied separately, and ksp replaces kapt
# (kapt is incompatible with built-in Kotlin).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
